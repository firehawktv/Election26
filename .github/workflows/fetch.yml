name: fetch results
on:
  push:
    paths: [".github/workflows/fetch.yml", "scripts/**"]
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"   # GitHub may delay scheduled runs a few minutes
concurrency:
  group: fetch
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/fetch.mjs
      - name: Commit data.json
        run: |
          if [ -n "$(git status --porcelain data.json)" ]; then
            git config user.name "results-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data.json
            git commit -qm "results $(date -u +%H:%M)"
            git pull -q --rebase origin main && git push -q origin HEAD:main
          fi
